name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag "otel-agent:${GITHUB_SHA}" .

      - name: Smoke test
        run: |
          docker run --detach --name smoke --publish 45638:45638 "otel-agent:${GITHUB_SHA}"
          if ! curl --retry 30 --retry-delay 1 --retry-all-errors --fail --silent --show-error http://127.0.0.1:45638/health; then
            docker logs smoke
            exit 1
          fi
          docker rm --force smoke

      # PRs never publish: they only build, smoke-test, and upload the artifact below.
      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          repo="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker tag "otel-agent:${GITHUB_SHA}" "${repo}:${GITHUB_SHA::12}"
          docker push "${repo}:${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag "otel-agent:${GITHUB_SHA}" "${repo}:latest"
            docker push "${repo}:latest"
          fi
          case "${GITHUB_REF}" in
            refs/tags/*)
              version="${GITHUB_REF_NAME#v}"
              docker tag "otel-agent:${GITHUB_SHA}" "${repo}:${version}"
              docker push "${repo}:${version}"
              ;;
          esac

      - name: Save image tarball
        run: docker save "otel-agent:${GITHUB_SHA}" | gzip > "otel-agent-${GITHUB_SHA}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: otel-agent-image
          path: otel-agent-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
